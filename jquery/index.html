<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="css/style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lemon-Lime Trivia</title>
  </head>

  <body>
    <div class="centered">
      <main>
        <div class="border">
          <h1 class="h1">Quiz</h1>
          <div id="score-tracker"></div>

          <div id="questions">Test question number one?</div>

          <div id="ans1" class="answers">Test answer1</div>
          <div id="ans2" class="answers">Test answer2</div>
          <div id="ans3" class="answers">Test answer3</div>
          <div id="ans4" class="answers">Test answer 4</div>
        </div>
        <div id="feedback" class="feedback">
          <div class="feedback-flex">
            <div class="result"></div>
            <div class="next"></div>
            <div class="complete hidden">Quiz complete</div>
          </div>
        </div>
      </main>
    </div>

    <script src="jquery-3_7_0-min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script> -->
    <script src="script.js"></script>
  </body>
</html>
